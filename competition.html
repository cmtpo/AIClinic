<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const BackToTop = () => {
            const [isVisible, setIsVisible] = useState(false);
            useEffect(() => {
                const toggle = () => setIsVisible(window.scrollY > 300);
                window.addEventListener("scroll", toggle);
                return () => window.removeEventListener("scroll", toggle);
            }, []);
            return (
                <div className={`fixed bottom-6 right-6 z-40 transition-all duration-300 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}`}>
                    <button
                        onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
                        className="bg-sky-600 hover:bg-sky-700 text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center transition-all hover:scale-110"
                        aria-label="返回頂部"
                    >
                        <i className="ph-bold ph-arrow-up text-xl"></i>
                    </button>
                </div>
            );
        };

        const NavigationDrawer = ({ isOpen, onClose }) => {
            const navItems = [

                    />
