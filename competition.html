<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統維護中 - 競賽評比專區</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #FEF9C3;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const MaintenancePage = () => {
            const [countdown, setCountdown] = useState(5);
            const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
            const [showMobilePopup, setShowMobilePopup] = useState(false);

            useEffect(() => {
                // Mobile detection
                const handleResize = () => {
                    const isNowMobile = window.innerWidth < 768;
                    setIsMobile(isNowMobile);
                    if (isNowMobile) {
                        setShowMobilePopup(true);
                    }
                };

                // Initial check
                if (window.innerWidth < 768) {
                    setShowMobilePopup(true);
                }

                window.addEventListener('resize', handleResize);

                // Countdown Logic
                const timer = setInterval(() => {
                    setCountdown((prev) => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            window.location.href = 'index.html';
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => {
                    clearInterval(timer);
                    window.removeEventListener('resize', handleResize);
                };
            }, []);

            // Right-click protection for images (Strict Mode)
            useEffect(() => {
                const handleContextmenu = (e) => {
                    // Prevent context menu on images and their overlays
                    if (e.target.tagName === 'IMG' || e.target.closest('.group')) {
                        e.preventDefault();
                    }
                };
                document.addEventListener('contextmenu', handleContextmenu, { capture: true }); // Use capture phase
                return () => {
                    document.removeEventListener('contextmenu', handleContextmenu, { capture: true });
                };
            }, []);

            return (
                <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
                    {/* Background Pattern */}
                    <div className="absolute inset-0 opacity-10 pointer-events-none">
                        <i className="ph-fill ph-cone text-yellow-500 absolute top-10 left-10 text-9xl transform -rotate-12"></i>
                        <i className="ph-fill ph-barrier text-yellow-500 absolute bottom-10 right-10 text-9xl transform rotate-12"></i>
                    </div>

                    <div className="bg-white rounded-3xl shadow-xl p-8 md:p-12 max-w-xl w-full text-center border-b-8 border-yellow-400 relative z-10">
                        <div className="w-24 h-24 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center text-5xl mx-auto mb-6 shadow-inner animate-pulse">
                            <i className="ph-fill ph-wrench"></i>
                        </div>

                        <h1 className="text-2xl md:text-3xl font-black text-gray-800 mb-4 flex flex-col items-center justify-center md:block">
                            <span>競賽評比專區</span>
                            <span className="hidden md:inline"> </span>
                            <span>系統維護更新中</span>
                        </h1>

                        <p className="text-gray-500 mb-8 leading-relaxed px-2 md:px-8 text-sm md:text-base">
                            為了提供更好的服務體驗，本專區正在進行功能優化與改版。造成不便，敬請見諒。
                        </p>

                        <div className="bg-yellow-50 rounded-xl p-4 mb-6 border border-yellow-100">
                            <p className="text-yellow-700 font-bold mb-1">
                                <i className="ph-bold ph-timer mr-2 animate-spin-slow"></i>
                                即將自動返回首頁
                            </p>
                            <div className="text-3xl font-black text-yellow-600">
                                {countdown} <span className="text-sm font-normal text-yellow-500">秒</span>
                            </div>
                        </div>

                        <button
                            onClick={() => window.location.href = 'index.html'}
                            className="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-8 rounded-full transition-all shadow-lg hover:shadow-yellow-300/50 w-full"
                        >
                            <i className="ph-bold ph-arrow-u-up-left mr-2"></i>
                            立即返回首頁
                        </button>
                    </div>

                    {/* Mobile Popup Modal */}
                    {showMobilePopup && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-6 animate-in fade-in zoom-in duration-300">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-xs text-center shadow-2xl border-4 border-yellow-400">
                                <div className="w-16 h-16 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
                                    <i className="ph-fill ph-warning-circle"></i>
                                </div>
                                <h3 className="text-xl font-bold text-gray-800 mb-2">專區維護中</h3>
                                <p className="text-sm text-gray-500 mb-5">
                                    競賽專區目前正在進行改版，請稍後再試。
                                </p>
                                <button
                                    onClick={() => window.location.href = 'index.html'}
                                    className="bg-gray-800 text-white font-bold py-3 px-4 rounded-xl w-full text-sm"
                                >
                                    我知道了 (返回首頁 {countdown})
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MaintenancePage />);
    </script>
</body>

</html>
