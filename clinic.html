        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .envelope-pattern {
            background-image: repeating-linear-gradient(45deg,

                    #ef4444 10px,

                    #3b82f6 30px,
                    transparent 30px,
                    transparent 40px);
            height: 8px;
            width: 100%;
        }

        /* Drawer Backdrop Fade */
        .backdrop-enter {
            opacity: 0;
        }

        .backdrop-enter-active {
            opacity: 1;
            transition: opacity 300ms;
        }

        .backdrop-exit {
            opacity: 1;
        }

        .backdrop-exit-active {
            opacity: 0;
            transition: opacity 300ms;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Back To Top Component ---
        const BackToTop = () => {
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const toggleVisibility = () => {
                    if (window.pageYOffset > 300) {
                        setIsVisible(true);
                    } else {
                        setIsVisible(false);
                    }
                };

                window.addEventListener("scroll", toggleVisibility);
                return () => window.removeEventListener("scroll", toggleVisibility);
            }, []);

            const scrollToTop = () => {
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            };

            return (
                <div className={`fixed bottom-6 right-6 z-40 transition-all duration-300 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}`}>
                    <button
                        onClick={scrollToTop}
                        className="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center transition-all hover:scale-110 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2"
                        aria-label="返回頂部"
                    >
                        <i className="ph-bold ph-arrow-up text-xl"></i>
                    </button>
                </div>
            );
        };

        // --- Navigation Drawer Component (功能 3: 全域導航) ---
        const NavigationDrawer = ({ isOpen, onClose, activeSection, onSectionChange }) => {
            const navItems = [
                {
                    id: 'home',
                    title: '首頁',
                    url: 'index.html',
                    icon: 'ph-house',
                    active: false,
                    subItems: [
                        { id: 'marquee-section', label: '最新衛教海報' },
                        { id: 'cards-section', label: '各專區入口' }
                    ]
                },
                {
                    id: 'clinic',
                    title: '合作院所專區',
                    url: 'clinic.html',
                    icon: 'ph-stethoscope',
                    active: true, // 標記為當前頁面
                    subItems: [
                        { id: 'sop', label: '執行作業 SOP' },
                        { id: 'money', label: '經費與核銷' },
                        { id: 'docs', label: '表單與寄送' },
                        { id: 'qa', label: '必做任務與 QA' }
                    ]
                },
                {
                    id: 'materials',
                    title: '數位教材與海報',
                    url: 'materials.html',
                    icon: 'ph-graduation-cap',
                    active: false,
                    subItems: [
                        { id: 'video', label: '影片教材' },
                        { id: 'briefing', label: '說明會簡報' },
                        { id: 'poster', label: '海報與模板' },
                        { id: 'doc', label: '文件下載' }
                    ]
                },
                {
                    id: 'competition',
                    title: '競賽評比專區',
                    url: 'competition.html',
                    icon: 'ph-trophy',
                    active: false,
                },
            ];

            const [expandedMenus, setExpandedMenus] = useState({});

            useEffect(() => {
                if (isOpen) {
                    const initialExpanded = {};
                    navItems.forEach(item => {
                        if (item.active && item.subItems) {
                            initialExpanded[item.id] = true;
                        }
                    });
                    setExpandedMenus(initialExpanded);
                }
            }, [isOpen]);

            const toggleMenu = (itemId) => {
                setExpandedMenus(prev => ({
                    ...prev,
                    [itemId]: !prev[itemId]
                }));
            };

            return (
                <>
                    {/* Backdrop (遮罩) */}
                    <div
                        className={`fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] transition-opacity duration-300 ${isOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}
                        onClick={onClose}
                    />

                    {/* Drawer (側邊欄) */}
                    <div className={`fixed top-0 right-0 h-full w-80 bg-white shadow-2xl z-[70] transform transition-transform duration-300 ease-in-out ${isOpen ? 'translate-x-0' : 'translate-x-full'} flex flex-col`}>
                        {/* Drawer Header */}
                        <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-blue-50">
                            <h3 className="font-bold text-slate-800 flex items-center">
                                <i className="ph-fill ph-list text-blue-600 mr-2 text-xl"></i>
                                網站導航
                            </h3>
                            <button onClick={onClose} className="w-8 h-8 rounded-full bg-white text-slate-500 hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition-colors">
                                <i className="ph-bold ph-x text-lg"></i>
                            </button>
                        </div>

                        {/* Drawer Content */}
                        <div className="flex-1 overflow-y-auto p-4 space-y-2">
                            {navItems.map((item) => (
                                <div key={item.id} className="mb-2">
                                    <div className={`flex items-center w-full rounded-xl transition-all ${item.active ? 'bg-blue-100 text-blue-800' : 'text-slate-600 hover:bg-slate-50'}`}>
                                        <a
                                            href={item.active ? '#' : item.url}
                                            onClick={(e) => {
                                                if (item.active) e.preventDefault();
                                            }}
                                            className="flex-1 flex items-center p-3 font-bold"
                                        >
                                            <i className={`ph-fill ${item.icon} mr-3 text-2xl ${item.active ? 'text-blue-600' : 'text-slate-400'}`}></i>
                                            {item.title}
                                            {item.active && <span className="ml-2 text-xs bg-blue-200 text-blue-800 px-2.5 py-1 rounded-full">目前頁面</span>}
                                        </a>

                                        {item.subItems && (
                                            <button
                                                onClick={(e) => {
                                                    e.preventDefault();
                                                    e.stopPropagation();
                                                    toggleMenu(item.id);
                                                }}
                                                className="p-3 text-slate-400 hover:text-blue-600 focus:outline-none"
                                            >
                                                <i className={`ph-bold ph-caret-down transition-transform duration-300 ${expandedMenus[item.id] ? 'rotate-180' : ''}`}></i>
                                            </button>
                                        )}
                                    </div>

                                    <div
                                        className={`overflow-hidden transition-all duration-300 ease-in-out ${expandedMenus[item.id] ? 'max-h-96 opacity-100 mt-2' : 'max-h-0 opacity-0'}`}
                                    >
                                        {item.subItems && (
                                            <div className="ml-4 pl-4 border-l-2 border-slate-100 space-y-1">
                                                {item.subItems.map(sub => (
                                                    <button
                                                        key={sub.id || sub.label}
                                                        onClick={() => {
                                                            if (item.active && onSectionChange) {
                                                                onSectionChange(sub.id);
                                                                onClose();
                                                            } else {
                                                                const targetUrl = sub.id ? `${item.url}#${sub.id}` : item.url;
                                                                window.location.href = targetUrl;
                                                            }
                                                        }}
                                                        className={`block w-full text-left py-2 px-3 text-sm rounded-lg transition-colors ${item.active && activeSection === sub.id ? 'text-orange-600 font-bold bg-orange-50' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-50'}`}
                                                    >
                                                        {sub.label}
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Drawer Footer */}
                        <div className="p-6 border-t border-slate-100 bg-slate-50 text-center">
                            <p className="text-sm text-slate-500 font-medium">臺南愛(AI)腸篩計畫</p>
                        </div>
                    </div>
                </>
            );
        };

        // --- Dropdown Component for Docs ---
        const DocDropdown = ({ icon, label, color, options }) => {
            const [isOpen, setIsOpen] = useState(false);

            return (
                <div className="w-full mb-2 last:mb-0 transition-all duration-300">
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className={`w-full flex items-center justify-between p-3.5 rounded-xl border transition-all text-sm font-bold text-${color}-600 bg-white border-${color}-200 hover:bg-${color}-50 shadow-sm`}
                    >
                        <div className="flex items-center text-left">
                            <i className={`ph-bold ${icon} mr-3 flex-shrink-0 text-lg`}></i>
                            <span className="leading-tight">{label}</span>
                        </div>
                        <i className={`ph-bold ph-caret-down transition-transform duration-300 ${isOpen ? 'rotate-180' : ''} ml-2 flex-shrink-0 text-xs`}></i>
                    </button>

                    <div
                        className={`overflow-hidden transition-all duration-300 ease-in-out ${isOpen ? 'max-h-[1000px] opacity-100 mt-2' : 'max-h-0 opacity-0 mt-0'}`}
                    >
                        <div className={`bg-slate-50 border border-slate-200 rounded-xl overflow-hidden border-l-4 border-l-${color}-400`}>
                            {options.map((opt, idx) => (
                                <a
                                    key={idx}
                                    href={opt.url}
                                    target="_blank"
                                    onClick={() => {
                                        if (typeof gtag === 'function') {
                                            gtag('event', 'download', {
                                                'event_category': 'clinic_doc',
                                                'event_label': opt.name,
                                                'file_name': opt.name
                                            });
                                        }
                                    }}
                                    className="block px-4 py-3 text-xs md:text-sm text-slate-700 hover:bg-white hover:text-blue-600 border-b last:border-b-0 border-slate-200 break-words leading-relaxed flex items-center group font-medium"
                                >
                                    <i className="ph-fill ph-download-simple mr-3 text-slate-400 group-hover:text-blue-500 transition-colors text-lg"></i>
                                    <span>{opt.name}</span>
                                </a>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const CLINIC_DOCS = {
            envelope: {
                pdf: "https://drive.google.com/file/d/1nBx3s4ensDmTCoporeX3sRBvoyONZJfW/view",
                docx: "https://docs.google.com/document/d/1q-u65ZMDTOlVyIwXK_WX1dsp5OfrEqOY/edit"
            },
            guide: "https://drive.google.com/file/d/1EG7Y_YralbOAUr9uJVUQgtKvs8IWrA3Z/view",
            forms: [
                {
                    id: 'B01',
                    name: 'B01 公會 撥款確認單 (診所用)',
                    pdf: "https://drive.google.com/file/d/14yg8zbVg1orXaDmpVfhgdNVEvt449gSz/view",
                    docx: "https://docs.google.com/document/d/1xKpDVu9eGhWrwcdWOuzUmvUGVq0Pujnw/edit"
                },
                {
                    id: 'B02',
                    name: 'B02 公會 院所獎勵金領據 (診所用)',
                    pdf: "https://drive.google.com/file/d/1l3bMgpGsyJzMPxODULMWhUn1LWBAfV3B/view",
                    docx: "https://docs.google.com/document/d/14TgGy21RXaP4Uo0RoBSSVuislnI2u-_Z/edit"
                },
                {
                    id: 'B03',
                    name: 'B03 公會 院所送件清單 (診所用)',
                    pdf: "https://drive.google.com/file/d/1mkBbCkVtqBnNaZ-EyriJz_9YGms0x_Yi/view",
                    docx: "https://docs.google.com/document/d/11vf3K21LgCh2Nl1IRHP14xcgUjGR1oQm/edit"
                }
            ]
        };

        const HOSPITAL_DOCS = {
            envelope: {
                docx: "https://docs.google.com/document/d/1RWfzVneTbTCF3c1Bq3kcXiiqQAgPdC5e/edit?usp=drive_link&ouid=109142458505059369164&rtpof=true&sd=true",
            },
            guide: "https://drive.google.com/file/d/15H1x268Cdsn_k0isp0Nfi8Dt-77TTMpT/view?usp=drive_link",
            forms: [
                {
                    id: 'B01',
                    name: 'B01 公會 撥款確認單 (醫院用)',
                    docx: "https://docs.google.com/document/d/1qE2BrWpuYnc9JWvJrBvzAhvHy55W9YBZ/edit?usp=drive_link&ouid=109142458505059369164&rtpof=true&sd=true",
                    pdf: "https://drive.google.com/file/d/1lgVVinxFg5-eGgIdAkQnONbfyDMgunSd/view?usp=drive_link"
                },
                {
                    id: 'B02',
                    name: 'B02 院所獎勵金領據 (醫院用)',
                    docx: "https://docs.google.com/document/d/1V-cu18DYCWqmLwH5__pW477wsvyAXV_w/edit?usp=drive_link&ouid=109142458505059369164&rtpof=true&sd=true",
                    pdf: "https://drive.google.com/file/d/1TIIUkmokIeLCnvV3avZ9ZEfXn-86vym0/view?usp=drive_link"
                },
                {
                    id: 'B03',
                    name: 'B03 公會 送件清單 (醫院用)',
                    docx: "https://docs.google.com/document/d/14v_U5KnmD9hT727napoC1BJFEAqwDD_e/edit?usp=drive_link&ouid=109142458505059369164&rtpof=true&sd=true",
                    pdf: "https://drive.google.com/file/d/1F6Xwks34n9GCaJt3y8RSXCi7TNUJZ-f1/view?usp=drive_link"
                },
                {
                    id: 'B05',
                    name: 'B05 個人領據 (醫院用)',
                    docx: "https://docs.google.com/document/d/1W8kM238GEtlYIfIM5PTr6_X2bpndZGU4/edit?usp=drive_link&ouid=109142458505059369164&rtpof=true&sd=true",
                    pdf: "https://drive.google.com/file/d/1oRaXs9GqzwPY41unQlTB8lSKjg6iAPKY/view?usp=drive_link"
                }
            ]
        };

        // --- Shared Header ---
        const Header = ({ title, subtitle, themeColor, onMenuClick }) => (
            <header className={`bg-white shadow-sm sticky top-0 z-50 border-b-4 border-${themeColor}-500 transition-all`}>
                <div className="max-w-7xl mx-auto px-4 md:px-6 h-16 flex items-center justify-between">
                    <div className="flex items-center cursor-pointer" onClick={() => window.location.href = 'index.html'}>
                        <div className={`p-2 rounded-full bg-${themeColor}-100 text-${themeColor}-600 mr-3 flex items-center justify-center`}>
                            <i className="ph-fill ph-stethoscope text-xl"></i>
                        </div>
                        <div>
                            <h1 className="text-lg md:text-xl font-bold text-gray-800 leading-tight">{title}</h1>
                            <p className="text-xs md:text-sm text-gray-500 mt-1">{subtitle}</p>
                        </div>
                    </div>

                    <div className="flex items-center gap-2">
                        <button
                            onClick={() => window.location.href = 'index.html'}
                            className="hidden md:flex text-xs md:text-sm text-gray-500 hover:text-gray-800 items-center bg-gray-100 px-3 py-1.5 rounded-lg transition-colors mr-2"
                        >
                            <i className="ph-bold ph-arrow-u-up-left mr-2"></i> 回首頁
                        </button>
                        <button
                            onClick={onMenuClick}
                            className="w-10 h-10 rounded-xl bg-slate-50 hover:bg-blue-50 text-slate-600 hover:text-blue-600 flex items-center justify-center transition-all focus:ring-2 focus:ring-blue-200"
                            aria-label="開啟選單"
                        >
                            <i className="ph-bold ph-list text-2xl"></i>
                        </button>
                    </div>
                </div>
            </header>
        );

        const Footer = () => (
            <footer className="mt-16 py-12 bg-white border-t border-slate-200 text-center">
                <p className="text-slate-500 text-sm font-medium">© 2025 臺南愛(AI)腸篩計畫 | 台南市醫師公會 x 成大醫院</p>
            </footer>
        );

        // --- QA Item Component ---
        const QAItem = ({ q, a, category }) => {
            const [isOpen, setIsOpen] = useState(false);
    const getTagStyle = (cat) => {
                switch (cat) {
                    case 'eligibility': return { color: 'bg-green-100 text-green-700 border-green-200', text: '民眾權益' };
                    case 'referral': return { color: 'bg-purple-100 text-purple-700 border-purple-200', text: '轉診規範' };
                    case 'admin': return { color: 'bg-blue-100 text-blue-700 border-blue-200', text: '行政核銷' };
                    case 'system': return { color: 'bg-orange-100 text-orange-700 border-orange-200', text: '系統操作' };
                    case 'resources': return { color: 'bg-cyan-100 text-cyan-700 border-cyan-200', text: '計畫諮詢' };
                    default: return { color: 'bg-gray-100 text-gray-700 border-gray-200', text: '其他' };
                }
            };

            const tagInfo = getTagStyle(category);
            const tagColor = tagInfo.color;
            const tagText = tagInfo.text;

            return (
                <div className="border border-slate-200 rounded-xl overflow-hidden hover:shadow-md transition-shadow bg-white mb-3">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full text-left px-4 py-4 font-bold text-slate-800 flex items-start justify-between bg-slate-50 hover:bg-slate-100 transition-colors">
                        <div className="flex-1 pr-4">
                            <div className="flex items-center mb-2">
                                <span className={`text-xs px-2.5 py-1 rounded-md border font-bold ${tagColor} mr-2`}>{tagText}</span>
                            </div>
                            <div className="flex items-start">
                                <span className="bg-slate-800 text-white text-xs px-2 py-0.5 rounded mr-3 mt-1.5 flex-shrink-0">Q</span>
                                <span className="leading-relaxed text-base md:text-lg font-bold">{q}</span>
                            </div>
                        </div>
                        <i className={`ph-bold ph-caret-down text-slate-400 transition-transform mt-2 ${isOpen ? 'rotate-180' : ''}`}></i>
                    </button>
                    {isOpen && (
                        <div className="px-6 py-5 bg-white text-slate-700 text-base md:text-lg leading-relaxed border-t border-slate-100 animate-in fade-in slide-in-from-top-1 pl-16">
                            <span className="font-black text-green-600 mr-2">A:</span> {a}
                        </div>
                    )}
                </div>
            );
        };

        // --- Clinic Portal (Main Content) ---
        const ClinicPortal = () => {
            const [activeSection, setActiveSection] = useState('sop');
            const [qaFilter, setQaFilter] = useState('all');

            const [isGlobalNavOpen, setIsGlobalNavOpen] = useState(false);
            const [isDocSectionOpen, setIsDocSectionOpen] = useState(window.innerWidth >= 768);
            const [docSubTab, setDocSubTab] = useState('clinic');

            useEffect(() => {
                const hash = window.location.hash.substring(1);
                if (hash) {
                    const validSections = ['sop', 'money', 'docs', 'qa'];
                    if (validSections.includes(hash)) {
                        setActiveSection(hash);
                    }
                }
            }, []);

            // Right-click protection for images (Strict Mode)
            useEffect(() => {
                const handleContextmenu = (e) => {
                    // Prevent context menu on images and their overlays
                    if (e.target.tagName === 'IMG' || e.target.closest('.group')) {
                        e.preventDefault();
                    }
                };
                document.addEventListener('contextmenu', handleContextmenu, { capture: true }); // Use capture phase
                return () => {
                    document.removeEventListener('contextmenu', handleContextmenu, { capture: true });
                };
            }, []);

            const sidebarItems = [
                { id: 'sop', label: '執行作業 SOP', icon: 'ph-clipboard-text' },
                { id: 'money', label: '經費與核銷', icon: 'ph-currency-circle-dollar', highlight: true },
                { id: 'docs', label: '表單與寄送', icon: 'ph-files' },
                { id: 'qa', label: '必做任務與 QA', icon: 'ph-question' },
            ];

            const qaData = [
                // 1. 民眾資格與領獎權益

                                        </div>
                                    </div>

                                </div>
                            )}

                        </main>
                    </div>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
